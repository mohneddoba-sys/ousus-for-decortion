<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أسس للديكور — نظام تجريبي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{--bg:#F5F5F3;--p:#FFFFFF;--pa:#F0F0EE;--bd:#DADAD6;--bs:#E7E7E3;--w:#141414;--ws:#333333;--g:#B8874A;--gs:#D8AE72;--gr:#5F6B47;--t:#1A1A1A;--d:#6B6B66;--rd:#A23B2E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font-family:Tajawal,sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
h1,h2,h3{font-family:Cairo,Tajawal,sans-serif;margin:0}h2{color:var(--w);font-size:19px}h3{color:var(--w);font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;padding:16px 20px;border-bottom:2px solid var(--g)}
.br{display:flex;align-items:center;gap:12px}.br img{width:44px;height:44px;object-fit:contain}.br h1{font-size:18px;color:var(--w)}.br span{font-size:11.5px;color:var(--d)}
.mt{background:var(--pa);color:var(--w);border:1px solid var(--bd);font-size:18px;padding:6px 14px}
.bk{position:fixed;inset:0;background:#140f0a73;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}.bk.o{opacity:1;pointer-events:auto}
.sb{position:fixed;top:0;right:0;height:100%;width:260px;max-width:85vw;background:var(--p);box-shadow:-6px 0 24px #140f0a40;transform:translateX(105%);transition:transform .25s;z-index:21;padding:16px 10px;overflow:auto}.sb.o{transform:none}
.sb a{display:block;padding:12px 14px;border-radius:4px;color:var(--t);cursor:pointer}.sb a:hover{background:var(--pa)}.sb a.on{background:var(--w);color:#F6ECDC;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
.card{background:var(--p);border:1px solid var(--bs);border-radius:4px;padding:16px;margin-bottom:16px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--bs);border:1px solid var(--bs);border-radius:4px;overflow:hidden;margin-bottom:16px}.kp div{background:var(--p);padding:14px}.kp b{display:block;font-family:Cairo;font-size:20px;color:var(--w)}.kp span{font-size:12px;color:var(--d)}.kp input{width:100%}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:right;font-size:12px;color:var(--d);font-weight:500;padding:0 10px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:11px 10px;border-bottom:1px solid var(--bs);font-size:13.5px;white-space:nowrap}tr:hover td{background:#14141408}
button,.bt{background:var(--w);color:#F6ECDC;border:1px solid var(--w);border-radius:4px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}button:hover{background:var(--ws)}
.bg{background:var(--g);border-color:var(--g);color:#2A1608}.bg:hover{background:var(--gs)}.bw{background:transparent;color:var(--t);border-color:var(--bd)}.bw:hover{background:transparent;color:var(--w);border-color:var(--w)}.bx{background:transparent;color:var(--rd);border-color:var(--rd)}.bx:hover{background:#a23b2e1a}.sm{padding:4px 11px;font-size:12.5px;font-weight:500}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:4px;font:inherit;background:#fff;color:var(--t);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--w)}label{display:block;font-size:12.5px;color:var(--d);margin-bottom:4px}
.hd{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.hd input{max-width:220px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{background:#fff;color:var(--t);border:1px solid var(--bd);border-radius:20px;font-weight:500;white-space:nowrap}.tabs button.on{background:var(--w);color:#F6ECDC;border-color:var(--w)}
.ov{position:fixed;inset:0;background:#140f0a73;display:flex;align-items:center;justify-content:center;z-index:30;padding:10px}.md{background:var(--p);border-radius:4px;padding:20px;width:640px;max-width:100%;max-height:92vh;overflow:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}.em{text-align:center;color:var(--d);padding:22px}.mn{font-size:12.5px;color:var(--d);margin:0 0 10px}
.bd{display:inline-block;border:1px solid var(--bd);background:#fff;color:var(--g);border-radius:20px;padding:2px 12px;font-size:12px;font-family:Tajawal;font-weight:500}
#ts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--w);color:#F6ECDC;padding:10px 22px;border-radius:20px;font-weight:700;z-index:99;display:none}
.q{background:#FBF6EC;color:#2E2117}.q h1{color:var(--w)}.q th{background:var(--w);color:#F6ECDC;padding:10px}.q td{border-bottom:1px solid #E7D5AE}.tt{margin-top:12px;line-height:1.9;text-align:left}
@media(max-width:600px){.top,main{padding-left:12px;padding-right:12px}}
@media print{body>*:not(.ov){display:none!important}.ov{position:static;background:none;padding:0}.md{width:100%;max-height:none;overflow:visible}.np{display:none!important}}
</style></head><body><header class="top"><div class="br"><img id="lg" alt=""><div><h1>أسس للديكور</h1><span>نموذج تجريبي — المشاريع والمقايسات وعروض الأسعار</span></div></div><button class="mt" onclick="tm()">☰</button></header><div class="bk" id="bk" onclick="tm()"></div><nav id="nv" class="sb"></nav><main id="m"></main><div id="ts"></div>

return`<div class="hd"><h2>المقايسات</h2><span><select style="width:auto" onchange="cur=this.value;go()">${P.map(x=>`<option value="${x.id}" ${x.id==cur?'selected':''}>${E(x.name)}</option>`).join('')}</select> <button onclick="ed('items')">+ بند</button> <button class="bg" onclick="pboq()">طباعة الكميات</button></span></div>
<div class="kp"><div><span>عدد البنود</span><b>${t.its.length}</b></div><div><span>مساحة الأرضيات م²</span><b>${f2(fl)}</b></div><div><span>مساحة الجدران م²</span><b>${f2(wl)}</b></div><div><span>إجمالي التكلفة</span><b>${f2(t.cost)}</b></div><div><span>إجمالي البيع</span><b>${f2(t.sub)}</b></div></div>
<div class="card"><div class="tw"><table><tr><th>#</th><th>البند</th><th>الكمية</th><th>الهدر %</th><th>الكمية بعد الهدر</th><th>الوحدة</th><th>سعر الوحدة</th><th>المورد</th><th>التكلفة</th><th>البيع</th><th></th></tr>${t.its.map((i,x)=>{const m=i.materialId&&by('materials',i.materialId);return`<tr><td>${x+1}</td><td>${E(i.desc)}</td><td>${f2(i.qty)}</td><td>${f2(i.waste)}</td><td>${f2(i.qty*(1+i.waste/100))}</td><td>${E(i.unit)}</td><td>${f2(i.price)}</td><td>${E(m?m.supplier:'—')}</td><td>${f2(t.c[x].cost)}</td><td>${f2(t.c[x].sell)}</td><td><button class="sm" onclick="ed('items','${i.id}')">تعديل</button> <button class="sm bx" onclick="del('items','${i.id}')">حذف</button></td></tr>`}).join('')}</table></div>${t.its.length?'':'<div class="em">لا توجد بنود في مقايسة هذا المشروع</div>'}</div>
<div class="card"><h3>كل المشاريع</h3><div class="tw"><table><tr><th>المشروع</th><th>البنود</th><th>التكلفة</th><th>البيع</th><th>الربح</th><th></th></tr>${P.map(x=>{const y=pt(x);return`<tr><td>${E(x.name)}</td><td>${y.its.length}</td><td>${f2(y.cost)}</td><td>${f2(y.sub)}</td><td>${f2(y.sub-y.cost)}</td><td><button class="sm" onclick="cur='${x.id}';go('boq')">عرض</button> <button class="sm bw" onclick="cur='${x.id}';go('pd')">المشروع</button></td></tr>`}).join('')}</table></div></div>`}
function cd(){const c=by('customers',cur);if(!c){go('customers');return''}
const P=db.projects.filter(p=>p.customerId==cur),A=db.activities.filter(a=>a.customerId==cur).slice().reverse(),Ta=db.tasks.filter(x=>x.customerId==cur);
return`<div class="hd"><h2>${E(c.name)} ${c.tag&&c.tag!='عادي'?`<span class="bd" style="border-color:${TAGC[c.tag]};color:${TAGC[c.tag]}">${E(c.tag)}</span>`:''}</h2><span><button class="sm bw" onclick="ed('customers','${c.id}')">تعديل</button> <button class="sm bw" onclick="go('customers')">← العملاء</button></span></div>
<p class="mn">${E(c.phone||'—')} · ${E(c.city||'')} · مصدر: ${E(c.source||'—')}${c.nextFollow?` · متابعة قادمة: ${E(c.nextFollow)}`:''}</p>
<div class="card"><h3>تواصل سريع عبر واتساب</h3><div class="hd" style="margin-top:10px"><select id="wa_t_${c.id}" style="width:auto">${Object.keys(WA_T).map(k=>`<option>${k}</option>`).join('')}</select><button class="sm" onclick="sendWaTemplate('${c.id}')">📤 إرسال</button></div></div>
<div class="card"><h3>سجل المتابعات (CRM)</h3>${A.length?A.map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bs)"><span><b style="color:var(--w);font-size:12px">${a.date.slice(0,10)}</b> — ${E(a.text)}</span><button class="sm bx" onclick="delAct('${a.id}')">حذف</button></div>`).join(''):'<div class="em">لا يوجد سجل متابعات بعد</div>'}
<div class="hd" style="margin-top:10px"><input id="na_${c.id}" placeholder="أضف ملاحظة متابعة..." onkeydown="if(event.key=='Enter')addAct('${c.id}')"><button class="sm" onclick="addAct('${c.id}')">+ إضافة</button></div></div>
<div class="card"><h3>مهام هذا العميل</h3>${Ta.length?Ta.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bs)"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${x.done?'checked':''} onchange="toggleTask('${x.id}')"><span style="${x.done?'text-decoration:line-through;color:var(--d)':''}">${E(x.text)}</span></label><button class="sm bx" onclick="delTask('${x.id}')">حذف</button></div>`).join(''):'<div class="em">لا توجد مهام بعد</div>'}
<div class="hd" style="margin-top:10px"><input id="nt_${c.id}" placeholder="مهمة جديدة..." onkeydown="if(event.key=='Enter')addTaskC('${c.id}')"><button class="sm" onclick="addTaskC('${c.id}')">+ إضافة</button></div></div>
<div class="card"><h3>مشاريع هذا العميل</h3>${P.length?`<div class="tw"><table><tr><th>المشروع</th><th>الحالة</th><th>القيمة</th><th></th></tr>${P.map(p=>`<tr><td>${E(p.name)}</td><td>${p.status}</td><td>${f2(pt(p).val)}</td><td><button class="sm bw" onclick="cur='${p.id}';go('pd')">فتح</button></td></tr>`).join('')}</table></div>`:'<div class="em">لا توجد مشاريع لهذا العميل بعد</div>'}<button class="sm" style="margin-top:8px" onclick="ed('projects')">+ مشروع جديد</button></div>`}
function addAct(cid){const el=$('#na_'+cid),v=el.value.trim();if(!v)return toast('اكتب نص المتابعة');db.activities.push({id:Date.now()+Math.random(),customerId:cid,text:v,date:now()});save();go()}
function delAct(id){db.activities=db.activities.filter(a=>a.id!=id);save();go()}
function addTaskC(cid){const el=$('#nt_'+cid),v=el.value.trim();if(!v)return toast('اكتب نص المهمة');db.tasks.push({id:Date.now()+Math.random(),customerId:cid,text:v,done:false});save();go()}
function toggleTask(id){const t=db.tasks.find(x=>x.id==id);t.done=!t.done;save();go()}
function delTask(id){db.tasks=db.tasks.filter(x=>x.id!=id);save();go()}
function pboq(){const p=by('projects',cur),t=pt(p),o=document.createElement('div');o.className='ov';const fid='bq_'+p.id;o.innerHTML=`<div class="md q"><div id="${fid}" style="padding:6px"><div style="display:flex;gap:12px;align-items:center"><img src="${LOGO}" width="80"><div><h1 style="margin:0">مقايسة كميات</h1>${E(db.s.org)}</div></div><p>المشروع: <b>${E(p.name)}</b> (${p.no}) · العميل: ${E(nm('customers',p.customerId))} · ${now().slice(0,10)}</p><div class="tw"><table><tr><th>#</th><th>البند</th><th>الكمية</th><th>الهدر %</th><th>الكمية بعد الهدر</th><th>الوحدة</th></tr>${t.its.map((i,x)=>`<tr><td>${x+1}</td><td>${E(i.desc)}</td><td>${f2(i.qty)}</td><td>${f2(i.waste)}</td><td>${f2(i.qty*(1+i.waste/100))}</td><td>${E(i.unit)}</td></tr>`).join('')}</table></div></div><div class="np"><br><button class="bg" onclick="toPdf('${fid}','مقايسة ${E(p.no)}.pdf')">⬇ تنزيل PDF</button> <button onclick="print()">طباعة</button> <button class="bg" onclick="this.closest('.ov').remove()">إغلاق</button></div></div>`;document.body.append(o)}

go();
</script></body></html>
